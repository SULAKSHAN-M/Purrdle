name: purrdle
description: "A Wordle-style Flutter word puzzle game."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/english_dict.txt
  - assets/title.png
